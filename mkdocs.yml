site_name: サイバーセキュリティノート(日本語訳)
site_description: ir0nstone/cybersec-notes の Pwn(binexp)と Rev(rev)の日本語訳
site_url: https://0xff-minusone.github.io/cybersec-notes-ja/
repo_url: https://github.com/0xff-minusone/cybersec-notes-ja
repo_name: 0xff-minusone/cybersec-notes-ja
# 前処理(tools/prepare_docs.py)で作る変換済みの Markdown
docs_dir: .site-src
site_dir: site
# 画像などが相対パスのまま解決されるよう、ページを foo.html の形で出力する
use_directory_urls: false
# (画像は前処理で gitbook-assets/ に改名してコピーする。ドットのディレクトリは出力されないため)

copyright: >-
  日本語訳。原著:
  <a href="https://github.com/ir0nstone/cybersec-notes">ir0nstone/cybersec-notes</a>
  (Andrej Ljubic)/ライセンス:
  <a href="https://github.com/0xff-minusone/cybersec-notes-ja/blob/main/LICENSE.md">GPL-3.0</a>

theme:
  name: material
  language: ja
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
  features:
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - search.highlight
    - search.suggest

plugins:
  - search:
      lang: ja

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ir0nstone/cybersec-notes
      name: 原著(ir0nstone/cybersec-notes)

